# Schválené odchylky makety od návrhu.
#
# Každá položka říká: na které stránce, jaký text (nebo jeho část) a proč se
# odchyluje. Skript tools/text_diff.py tyto položky nehlásí, takže zbylé číslo
# je čistý počet defektů.
#
# Kategorie důvodů:
#   zelena     — zapracovaná zelená připomínka, číslo v poli pripominka
#   vypln      — výplňový obsah návrhu (Lorem ipsum, vzorová data), nepřenáší se
#   doplni_se  — konkrétní údaj, který dodá úřad (adresy, IČO, jména)
#   navrh_chyba — v návrhu je zjevná chyba, maketa ji nepřenáší

odchylky:
  # ---- výplňový a vzorový obsah návrhu -------------------------------------
  - stranka: "*"
    text: "Lorem ipsum"
    duvod: vypln
  - stranka: "*"
    text: "List item"
    duvod: vypln
  - stranka: "o-uradu/organizacni-struktura.html"
    text: "Ministerstva zahraničních věcí"
    duvod: vypln
    poznamka: >
      Návrh má v organizační struktuře vzorový text převzatý z MZV
      (odbory zahraniční politiky, diplomatický protokol). Nepřenáší se.

  # ---- údaje, které dodá úřad ----------------------------------------------
  - stranka: "*"
    text: "Sokolovská"
    duvod: doplni_se
  - stranka: "*"
    text: "loremipsum@email.com"
    duvod: doplni_se
  - stranka: "o-uradu/pro-media.html"
    text: "IČO"
    duvod: doplni_se

  # ---- zapracované zelené připomínky ---------------------------------------
  - stranka: "vyhrazene-stavby/caste-dotazy.html"
    text: "Žádosti o povolení vyhrazené stavby se podávají prostřednictvím Portálu stavebníka"
    duvod: navrh_chyba
    poznamka: >
      Návrh má na stránce FAQ omylem perex ze stránky Portál stavebníka.
      Maketa má vlastní perex odpovídající obsahu stránky.
  - stranka: "metodicka-podpora/index.html"
    text: "Přehled dotčených orgánů"
    duvod: zelena
    pripominka: 61
    poznamka: Přehled dotčených orgánů přesunut z Územního rozvoje do Metodické podpory.
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Číslo účtu"
    duvod: zelena
    pripominka: 19
    poznamka: >
      Správní poplatky mají jedno primární umístění (zde), druhé místo
      (Jak probíhá řízení) na ně odkazuje.

  # ---- stránky, kde je návrh jen šablona s výplní --------------------------
  - stranka: "mapa-webu.html"
    text: "Stránka 1. úrovně"
    duvod: vypln
    poznamka: >
      Návrh mapy webu je obecná šablona s texty „Stránka 1. úrovně" a
      „Podstránka 2. úrovně". Maketa má skutečnou strukturu webu, takže vysoká
      pixelová odlišnost je správně a nemá se opravovat.
  - stranka: "mapa-webu.html"
    text: "Podstránka"
    duvod: vypln
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Základní údaje"
    duvod: zelena
    pripominka: 39
    poznamka: >
      Tabulka Základní údaje a Historie verzí jsou doplněné podle připomínek 39 a 40.
      Stránka je proto delší než návrh (2832 proti 1904 px).
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Historie verzí"
    duvod: zelena
    pripominka: 40

  # ---- detail stanoviska: proti návrhu doplněno ---------------------------
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Metodická podpora"
    duvod: zelena
    pripominka: 38
    poznamka: >
      Návrh má detail stanoviska bez levého submenu a bez bílého panelu, přes celou
      šířku. Připomínka 38 žádá zachovat kontext sekce, proto maketa submenu i panel má.
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Základní údaje"
    duvod: zelena
    pripominka: 34
    poznamka: >
      Platnost a aktuálnost jsou dvě povinná metadata u každého dokumentu, proto jsou
      uvedena i v detailu. Návrh tabulku nemá.
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Historie verzí"
    duvod: zelena
    pripominka: 40
  - stranka: "metodicka-podpora/stanovisko-detail.html"
    text: "Máte dotaz k metodickým stanoviskům"
    duvod: zelena
    poznamka: >
      Blok pomoci je v návrhu na ostatních stránkách Metodické podpory, na detailu chybí.
      Maketa ho má všude kvůli konzistenci.
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Vzor průvodní zprávy — dopravní stavby"
    duvod: zelena
    pripominka: 22
    poznamka: >
      Návrh má tři výplňové položky „Lorem ipsum". Maketa má sedm konkrétních
      formulářů, aby šel ukázat filtr podle typu stavby a typu řízení.
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Vzor průvodní zprávy — energetické stavby"
    duvod: zelena
    pripominka: 22
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Návrh na zahájení vyvlastňovacího řízení"
    duvod: zelena
    pripominka: 22
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Zadanému filtru neodpovídá žádný soubor"
    duvod: zelena
    pripominka: 22
    poznamka: >
      Prázdný stav filtru. V návrhu filtr není, takže ho návrh nemůže mít.
  - stranka: "vyhrazene-stavby/dokumenty-a-formulare.html"
    text: "Variabilní symbol"
    duvod: zelena
    pripominka: 19
    poznamka: >
      Návrh uvádí jen číslo účtu. Připomínka 19 přesunula správní poplatky sem jako
      na primární místo a str. 5 odkazuje i na variabilní symbol, proto zůstává.
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Protějšek pro stavebníky"
    duvod: zelena
    pripominka: 44
    poznamka: >
      Provázání s protějškovou stránkou „Co změní novela SZ" pro druhé publikum.
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Obě stránky používají stejný vzor"
    duvod: zelena
    pripominka: 44
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Často kladených otázkách pro dotčené orgány"
    duvod: zelena
    pripominka: 44
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Delimitace"
    duvod: zelena
    pripominka: 45
    poznamka: >
      Celá část k delimitaci včetně tabulky. Návrh ji nemá.
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Novela rozšiřuje okruh vyhrazených staveb"
    duvod: zelena
    pripominka: 45
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Řízení zahájené u obecného"
    duvod: zelena
    pripominka: 45
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Úřad předá spis"
    duvod: zelena
    pripominka: 45
  - stranka: "metodicka-podpora/prechodove-obdobi.html"
    text: "Vzory a formuláře jsou spravovány na jednom místě"
    duvod: zelena
    pripominka: 46
  - stranka: "metodicka-podpora/standardizace.html"
    text: "Metodický pokyn — struktura a značení"
    duvod: vypln
    poznamka: >
      Návrh má u všech souborů výplňové „Lorem ipsum". Maketa je nahradila
      názvy skutečných dokumentů; počet řádků v každé sekci sedí.
  - stranka: "metodicka-podpora/standardizace.html"
    text: "Vzorová struktura regulačního plánu"
    duvod: vypln
  - stranka: "metodicka-podpora/standardizace.html"
    text: "Materiály k dokumentaci pořizované podle dřívější právní úpravy"
    duvod: navrh_chyba
    poznamka: >
      Sekce „Starý zákon" je v maketě na stránce pod kotvou #stara, protože
      záložka na ni odkazuje. Návrh ukazuje jen záložku Nový zákon, obsah
      staré nikde nemá.
  - stranka: "metodicka-podpora/konzultacni-stredisko.html"
    text: "Formulář se odesílá do spisové služby úřadu"
    duvod: zelena
    pripominka: 50
    poznamka: >
      Vysvětlivka pod formulářem dotazu. Formulář v návrhu není, doplnila ho
      připomínka 50, takže ani vysvětlivka nemá v návrhu protějšek.
  - stranka: "metodicka-podpora/tisic-otazek-heslo.html"
    text: "Hledat v otázkách"
    duvod: navrh_chyba
    poznamka: >
      Text je v maketě zástupným textem vyhledávacího pole (atribut placeholder),
      ne obsahem stránky. Porovnání čte jen textové uzly, takže ho nenajde —
      omezení nástroje, ne chybějící obsah.
